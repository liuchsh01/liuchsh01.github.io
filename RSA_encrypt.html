<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA 纯前端加密工具</title>
    <!-- 引入 JSEncrypt 库，完美兼容 Java RSA/ECB/PKCS1Padding -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <style>
        :root {
            --primary-color: #4CAF50;
            --hover-color: #45a049;
            --bg-color: #f4f7f6;
            --border-color: #ccc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--hover-color);
        }
        button.btn-copy {
            background-color: #2196F3;
        }
        button.btn-copy:hover {
            background-color: #0b7dda;
        }
        .toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            padding: 10px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>RSA 加密工具</h2>
    
    <div class="form-group">
        <label for="publicKey">公钥 (Public Key Base64)</label>
        <!-- Java 后端往往直接提供去除了头尾的纯 Base64 字符串 -->
        <textarea id="publicKey" rows="5" placeholder="请输入公钥 (支持纯 Base64 或包含 -----BEGIN PUBLIC KEY----- 的 PEM 格式)"></textarea>
    </div>

    <div class="form-group">
        <label for="plainText">明文数据 (Source)</label>
        <textarea id="plainText" rows="4" placeholder="请输入需要加密的明文数据"></textarea>
    </div>

    <div class="btn-group">
        <button onclick="doEncrypt()">执行加密</button>
    </div>

    <div class="form-group" style="margin-top: 25px;">
        <label for="cipherText">加密结果 (Cipher Base64)</label>
        <textarea id="cipherText" rows="5" readonly placeholder="加密结果将显示在这里..."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-copy" onclick="copyResult()">一键复制结果</button>
    </div>
</div>

<!-- 提示框 -->
<div id="toast" class="toast">复制成功！</div>

<script>
    /**
     * 格式化公钥：
     * 如果用户输入的是纯 Base64（Java常用），JSEncrypt 需要标准的 PEM 格式。
     * 此方法会自动判断并补全头尾。
     */
    function formatPublicKey(key) {
        let trimmedKey = key.trim();
        if (trimmedKey.includes('-----BEGIN')) {
            return trimmedKey; // 已经是 PEM 格式
        }
        // 将纯 Base64 按照每行 64 个字符进行换行处理
        const keyChunked = trimmedKey.replace(/\s+/g, '').match(/.{1,64}/g);
        if (keyChunked) {
            return `-----BEGIN PUBLIC KEY-----\n${keyChunked.join('\n')}\n-----END PUBLIC KEY-----`;
        }
        return trimmedKey;
    }

    // 执行加密操作
    function doEncrypt() {
        const publicKeyInput = document.getElementById('publicKey').value;
        const plainTextInput = document.getElementById('plainText').value;

        if (!publicKeyInput) {
            showToast("请输入公钥！");
            return;
        }
        if (!plainTextInput) {
            showToast("请输入明文数据！");
            return;
        }

        try {
            // 1. 初始化 JSEncrypt 实例
            const encryptor = new JSEncrypt();
            
            // 2. 格式化并设置公钥
            const formattedKey = formatPublicKey(publicKeyInput);
            encryptor.setPublicKey(formattedKey);
            
            // 3. 执行加密，JSEncrypt 默认返回 Base64 编码的加密结果，完美契合 Java 的 Base64.encodeBase64
            const result = encryptor.encrypt(plainTextInput);
            
            if (result) {
                document.getElementById('cipherText').value = result;
            } else {
                showToast("加密失败，请检查公钥格式是否正确！");
            }
        } catch (error) {
            console.error(error);
            showToast("加密异常，请检查控制台报错信息。");
        }
    }

    // 一键复制功能
    function copyResult() {
        const cipherTextElement = document.getElementById('cipherText');
        const textToCopy = cipherTextElement.value;

        if (!textToCopy) {
            showToast("没有可复制的内容！");
            return;
        }

        // 使用现代 Clipboard API
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("✅ 复制成功！");
            }).catch(err => {
                fallbackCopyTextToClipboard(cipherTextElement);
            });
        } else {
            // 降级方案 (兼容旧版浏览器)
            fallbackCopyTextToClipboard(cipherTextElement);
        }
    }

    // 复制的降级兼容方案
    function fallbackCopyTextToClipboard(textArea) {
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            showToast("✅ 复制成功！");
        } catch (err) {
            showToast("复制失败，请手动选择复制。");
        }
    }

    // 显示 Toast 提示语
    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "toast show";
        setTimeout(function() {
            toast.className = toast.className.replace("show", "");
        }, 2000);
    }
</script>

</body>
</html>
