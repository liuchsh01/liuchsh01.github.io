<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>多行计算器</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #15231f;
      --muted: #60726c;
      --line: #d9e6e0;
      --paper: #ffffff;
      --mist: #f4f8f6;
      --teal: #0f766e;
      --teal-dark: #0b5f59;
      --teal-pale: #e3f3ee;
      --error: #bd3f3f;
      --error-pale: #fff0ef;
      --shadow: 0 18px 50px rgba(17, 52, 44, .11);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 6% 0%, #dff4ec 0, transparent 28rem),
        radial-gradient(circle at 100% 100%, #e9f4ed 0, transparent 30rem),
        var(--mist);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .shell { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 54px 0 40px; }

    .masthead { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }

    .eyebrow { margin: 0 0 8px; color: var(--teal); font-size: 12px; font-weight: 800; letter-spacing: .14em; }

    h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(34px, 5vw, 52px); font-weight: 700; letter-spacing: -.045em; line-height: 1; }

    .subtitle { max-width: 380px; margin: 0 0 3px; color: var(--muted); font-size: 14px; line-height: 1.65; }

    .workspace { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(340px, .95fr); overflow: hidden; background: var(--paper); border: 1px solid rgba(15, 118, 110, .12); border-radius: 22px; box-shadow: var(--shadow); }

    .entry, .results { min-width: 0; padding: 28px; }
    .entry { border-right: 1px solid var(--line); }

    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 32px; margin-bottom: 16px; }
    .section-head h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    .count { color: var(--muted); font-size: 12px; white-space: nowrap; }

    textarea {
      display: block;
      width: 100%;
      min-height: 330px;
      resize: vertical;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #fbfdfc;
      color: #243630;
      font: 500 14px/1.75 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    textarea::placeholder { color: #9caea7; }
    textarea:focus { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 4px rgba(15, 118, 110, .11); }

    .actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    button { border: 0; font: inherit; cursor: pointer; }
    .calculate { min-height: 44px; padding: 0 20px; border-radius: 10px; background: var(--teal); color: #fff; font-size: 14px; font-weight: 750; letter-spacing: .01em; transition: transform .16s, background .16s, box-shadow .16s; }
    .calculate:hover { background: var(--teal-dark); box-shadow: 0 7px 16px rgba(15, 118, 110, .22); }
    .calculate:active { transform: translateY(1px); }
    .hint { color: var(--muted); font-size: 12px; }

    .result-actions { display: flex; align-items: center; gap: 7px; }
    .copy-all, .percent-toggle { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #31433c; font-size: 12px; font-weight: 650; transition: border-color .16s, color .16s, background .16s; white-space: nowrap; }
    .copy-all:hover, .percent-toggle:hover { border-color: var(--teal); color: var(--teal-dark); background: #f8fffc; }
    .percent-toggle.active { border-color: var(--teal); background: var(--teal); color: #fff; }

    .output-window { height: 390px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfc; }
    .empty { display: grid; height: 100%; min-height: 0; place-items: center; padding: 32px; color: #83948e; text-align: center; font-size: 14px; line-height: 1.7; }

    .result-list { display: grid; height: 100%; gap: 9px; overflow-x: hidden; overflow-y: auto; padding: 10px; }
    .result-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 48px; padding: 9px 9px 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .result-row.error { border-color: #f0cfcd; background: var(--error-pale); }
    .line-number { color: #91a39c; font: 12px/1 "SFMono-Regular", Consolas, monospace; text-align: right; }
    .answer { min-width: 0; overflow: hidden; color: #17423b; font: 650 14px/1.4 "SFMono-Regular", Consolas, "Liberation Mono", monospace; overflow-wrap: anywhere; }
    .error .answer { color: var(--error); font-family: inherit; font-weight: 600; }
    .copy-one { min-width: 30px; height: 30px; border-radius: 7px; background: var(--teal-pale); color: var(--teal-dark); font-size: 13px; font-weight: 800; transition: background .16s, color .16s; }
    .copy-one:hover { background: var(--teal); color: #fff; }
    .copy-one:disabled { visibility: hidden; cursor: default; }

    .toast { position: fixed; z-index: 5; bottom: 24px; left: 50%; padding: 10px 15px; border-radius: 999px; background: #18352f; color: #fff; font-size: 13px; font-weight: 650; box-shadow: 0 8px 25px rgba(0,0,0,.18); opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .18s, transform .18s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 600px); padding: 30px 0 24px; }
      .masthead { display: block; margin-bottom: 20px; }
      .subtitle { margin-top: 14px; }
      .workspace { grid-template-columns: 1fr; border-radius: 16px; }
      .entry, .results { padding: 20px; }
      .entry { border-right: 0; border-bottom: 1px solid var(--line); }
      textarea { min-height: 270px; }
      .output-window { height: 330px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">BATCH ARITHMETIC</p>
        <h1>多行计算器</h1>
      </div>
      <p class="subtitle">每行输入一个公式，批量计算。支持 +、−、×、÷、括号、小数与百分号。</p>
    </header>

    <section class="workspace" aria-label="多行计算工作区">
      <div class="entry">
        <div class="section-head">
          <h2>计算公式</h2>
          <span class="count" id="formulaCount">5 行</span>
        </div>
        <textarea id="formulas" spellcheck="false" aria-label="多行计算公式">(799393+20100-763825)/(799393+20100)
(6+162895-6859)/(6+162895)
(95+121228-4202)/(95+121228)
(1+70151-3390)/(1+70151)
(2+7-8)/(2+7)</textarea>
        <div class="actions">
          <button class="calculate" id="calculate" type="button">计算全部</button>
          <span class="hint">⌘ / Ctrl + Enter</span>
        </div>
      </div>

      <div class="results">
        <div class="section-head">
          <h2>计算结果</h2>
          <div class="result-actions">
            <button class="percent-toggle" id="percentToggle" type="button" aria-pressed="false">转为百分数</button>
            <button class="copy-all" id="copyAll" type="button" disabled>复制全部结果</button>
          </div>
        </div>
        <div class="output-window">
          <div class="empty" id="emptyState">点击“计算全部”<br />每行结果会显示在这里</div>
          <div class="result-list" id="resultList" hidden aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const formulas = document.getElementById('formulas');
      const calculate = document.getElementById('calculate');
      const formulaCount = document.getElementById('formulaCount');
      const resultList = document.getElementById('resultList');
      const emptyState = document.getElementById('emptyState');
      const percentToggle = document.getElementById('percentToggle');
      const copyAll = document.getElementById('copyAll');
      const toast = document.getElementById('toast');
      let latestResults = [];
      let showPercent = false;
      let toastTimer;

      const updateLineCount = () => {
        const lines = formulas.value.split(/\r?\n/).filter(line => line.trim()).length;
        formulaCount.textContent = `${lines} 行`;
      };

      const showToast = (message) => {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      };

      const copyText = async (value, message) => {
        try {
          await navigator.clipboard.writeText(value);
        } catch {
          const helper = document.createElement('textarea');
          helper.value = value;
          helper.style.cssText = 'position:fixed;opacity:0';
          document.body.append(helper);
          helper.select();
          document.execCommand('copy');
          helper.remove();
        }
        showToast(message);
      };

      // Tokenizer + recursive descent parser: only arithmetic tokens are accepted.
      const evaluate = (source) => {
        const text = source.replace(/\s+/g, '').replace(/=$/, '');
        if (!text) throw new Error('公式为空');
        const tokens = [];
        let position = 0;
        while (position < text.length) {
          const rest = text.slice(position);
          const number = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);
          if (number) {
            tokens.push({ type: 'number', value: Number(number[0]) });
            position += number[0].length;
            continue;
          }
          const char = text[position];
          if ('+-*/()%'.includes(char)) {
            tokens.push({ type: char });
            position++;
            continue;
          }
          throw new Error(`不支持的字符：${char}`);
        }

        let index = 0;
        const peek = () => tokens[index]?.type;
        const take = () => tokens[index++];
        const primary = () => {
          if (peek() === '+') { take(); return primary(); }
          if (peek() === '-') { take(); return -primary(); }
          let value;
          if (peek() === '(') {
            take();
            value = expression();
            if (peek() !== ')') throw new Error('缺少右括号');
            take();
          } else {
            if (peek() !== 'number') throw new Error('需要数字或左括号');
            value = take().value;
          }
          while (peek() === '%') {
            take();
            value /= 100;
          }
          return value;
        };
        const term = () => {
          let value = primary();
          while (peek() === '*' || peek() === '/') {
            const operator = take().type;
            const right = primary();
            if (operator === '/' && right === 0) throw new Error('不能除以 0');
            value = operator === '*' ? value * right : value / right;
          }
          return value;
        };
        const expression = () => {
          let value = term();
          while (peek() === '+' || peek() === '-') {
            const operator = take().type;
            const right = term();
            value = operator === '+' ? value + right : value - right;
          }
          return value;
        };

        const result = expression();
        if (index < tokens.length) throw new Error('公式格式不正确');
        if (!Number.isFinite(result)) throw new Error('计算结果无效');
        return result;
      };

      const formatNumber = (value) => {
        if (Object.is(value, -0)) return '0';
        const formatted = Number(value.toPrecision(10));
        return Math.abs(formatted) >= 1e10 || (Math.abs(formatted) > 0 && Math.abs(formatted) < 1e-6)
          ? formatted.toExponential(9).replace(/\.?(0+)(e)/, '$2')
          : String(formatted);
      };

      const formatResult = (value) => showPercent ? `${formatNumber(value * 100)}%` : formatNumber(value);

      const render = () => {
        const lines = formulas.value.split(/\r?\n/);
        latestResults = lines
          .map((line, lineIndex) => ({ line: line.trim(), lineIndex }))
          .filter(item => item.line)
          .map(item => {
            try {
              const value = evaluate(item.line);
              return { ...item, answer: formatResult(value), error: false };
            } catch (error) {
              return { ...item, answer: error.message, error: true };
            }
          });

        emptyState.hidden = latestResults.length > 0;
        resultList.hidden = latestResults.length === 0;
        copyAll.disabled = !latestResults.some(item => !item.error);
        resultList.replaceChildren();
        latestResults.forEach((item) => {
          const row = document.createElement('div');
          row.className = `result-row${item.error ? ' error' : ''}`;
          const lineNumber = document.createElement('span');
          lineNumber.className = 'line-number';
          lineNumber.textContent = item.lineIndex + 1;
          const answer = document.createElement('code');
          answer.className = 'answer';
          answer.textContent = item.answer;
          answer.title = item.line;
          const copy = document.createElement('button');
          copy.className = 'copy-one';
          copy.type = 'button';
          copy.textContent = '复制';
          copy.setAttribute('aria-label', `复制第 ${item.lineIndex + 1} 行结果`);
          copy.disabled = item.error;
          if (!item.error) copy.addEventListener('click', () => copyText(item.answer, '结果已复制'));
          row.append(lineNumber, answer, copy);
          resultList.append(row);
        });
      };

      calculate.addEventListener('click', render);
      formulas.addEventListener('input', updateLineCount);
      formulas.addEventListener('keydown', event => {
        if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          render();
        }
      });
      copyAll.addEventListener('click', () => {
        const values = latestResults.filter(item => !item.error).map(item => item.answer);
        copyText(values.join('\n'), `已复制 ${values.length} 条结果`);
      });
      percentToggle.addEventListener('click', () => {
        showPercent = !showPercent;
        percentToggle.classList.toggle('active', showPercent);
        percentToggle.setAttribute('aria-pressed', String(showPercent));
        percentToggle.textContent = showPercent ? '显示小数' : '转为百分数';
        render();
      });

      updateLineCount();
      render();
    })();
  </script>
</body>
</html>
