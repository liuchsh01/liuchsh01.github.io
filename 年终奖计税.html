<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年终奖税前税后计算器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>年终奖税前税后计算器</h1>
        <p>根据财政部和税务总局这个文件，<a href="https://www.gov.cn/zhengce/zhengceku/202308/content_6900595.htm" target="_blank">https://www.gov.cn/zhengce/zhengceku/202308/content_6900595.htm</a>，里边有低级错误，确定税率要除12，扣除数居然不乘12，闹这种笑话真是影响法规的严肃性。</p>
        <p>引自：<a href="https://zhuanlan.zhihu.com/p/678450631" target="_blank">年终奖个税税率表及计算方法——单独计税</a></p>
        <p>请输入税前或税后的年终奖金额，选择相应的类型，然后点击计算。</p>
        <div class="form-group">
            <label for="inputAmount">输入金额：</label>
            <input type="number" id="inputAmount" step="0.01" placeholder="输入税前或税后金额">
        </div>
        <div class="form-group">
            <label for="inputType">金额类型：</label>
            <select id="inputType">
                <option value="preTax">税前</option>
                <option value="postTax">税后</option>
            </select>
        </div>
        <button onclick="calculate()">计算</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        function calculate() {
            const inputAmount = parseFloat(document.getElementById('inputAmount').value);
            const inputType = document.getElementById('inputType').value;
            let result, tax, resultDesc;

            if (isNaN(inputAmount)) {
                alert('请输入有效的金额！');
                return;
            }

            if (inputType === 'preTax') {
                result = calculatePostTax(inputAmount);
                resultDesc = '税后';
                tax = inputAmount - result;
            } else {
                result = calculatePreTax(inputAmount);
                resultDesc = '税前';
                tax = result - inputAmount;
            }

            document.getElementById('result').innerText = `${resultDesc}: ${result.toFixed(2)}元\n缴税: ${tax.toFixed(2)}元`;
        }

        function calculatePostTax(preTaxAmount) {
            const monthlyAmount = preTaxAmount / 12;
            let taxRate, quickDeduction;

            if (monthlyAmount <= 3000) {
                taxRate = 0.03;
                quickDeduction = 0;
            } else if (monthlyAmount <= 12000) {
                taxRate = 0.10;
                quickDeduction = 210;
            } else if (monthlyAmount <= 25000) {
                taxRate = 0.20;
                quickDeduction = 1410;
            } else if (monthlyAmount <= 35000) {
                taxRate = 0.25;
                quickDeduction = 2660;
            } else if (monthlyAmount <= 55000) {
                taxRate = 0.30;
                quickDeduction = 4410;
            } else if (monthlyAmount <= 80000) {
                taxRate = 0.35;
                quickDeduction = 7160;
            } else {
                taxRate = 0.45;
                quickDeduction = 15160;
            }

            const tax = preTaxAmount * taxRate - quickDeduction;
            const postTaxAmount = preTaxAmount - tax;
            return postTaxAmount;
        }

        function calculatePreTax(postTaxAmount) {
            let monthlyAmount = postTaxAmount / 12;
            let taxRate, quickDeduction;

            while(true) {
                if (monthlyAmount <= 3000) {
                    taxRate = 0.03;
                    quickDeduction = 0;
                } else if (monthlyAmount <= 12000) {
                    taxRate = 0.10;
                    quickDeduction = 210;
                } else if (monthlyAmount <= 25000) {
                    taxRate = 0.20;
                    quickDeduction = 1410;
                } else if (monthlyAmount <= 35000) {
                    taxRate = 0.25;
                    quickDeduction = 2660;
                } else if (monthlyAmount <= 55000) {
                    taxRate = 0.30;
                    quickDeduction = 4410;
                } else if (monthlyAmount <= 80000) {
                    taxRate = 0.35;
                    quickDeduction = 7160;
                } else {
                    taxRate = 0.45;
                    quickDeduction = 15160;
                }

                const preTaxAmount = (postTaxAmount - quickDeduction) / (1 - taxRate)

                // 检查一下计算是否正确
                const postTaxResult = calculatePostTax(preTaxAmount);
                if (postTaxAmount == postTaxResult || Math.abs(postTaxAmount - postTaxResult) < 1) {
                    // 计算成功，误差很低
                    return preTaxAmount;
                }

                if (monthlyAmount > 80000) {
                    return '计算失败'
                }
                // 尽量跳到下一档税率
                monthlyAmount += 3000;
            }

            return '计算失败';
        }
    </script>
</body>
</html>
