<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能单词筛选工具 (含变形识别)</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-color: #111827;
            --border-color: #d1d5db;
            --tag-bg: #e0e7ff;
            --tag-text: #3730a3;
            --meta-text: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
            color: var(--text-color);
            text-align: center;
            margin-bottom: 10px;
        }
        
        p.subtitle {
            text-align: center;
            color: var(--meta-text);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        .required::after {
            content: " *";
            color: #ef4444;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
            box-sizing: border-box;
            font-family: monospace;
            background-color: #fdfdfd;
        }
        
        textarea:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .checkbox-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .checkbox-group input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-section {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .badge {
            background-color: #f3f4f6;
            color: #374151;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #e5e7eb;
        }

        .word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .word-tag {
            background-color: var(--tag-bg);
            color: var(--tag-text);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #c7d2fe;
            animation: fadeIn 0.3s ease-in-out;
        }

        .word-tag .sub-info {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 2px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .empty-state {
            width: 100%;
            text-align: center;
            color: #9ca3af;
            padding: 30px;
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>智能单词筛选器</h1>
    <p class="subtitle">支持识别复数(s/es)和过去式(ed)的词根形式</p>

    <!-- 输入区域 -->
    <div class="form-group">
        <label for="sourceText" class="required">源文本</label>
        <textarea id="sourceText" placeholder="在此处粘贴文章、段落或单词列表..."></textarea>
    </div>

    <div class="input-row">
        <div class="form-group">
            <label for="wordLength" class="required">目标单词长度</label>
            <input type="number" id="wordLength" placeholder="例如: 5" min="1">
        </div>
        
        <div class="form-group">
            <label for="mustInclude">一定存在的字母</label>
            <input type="text" id="mustInclude" placeholder="例如: a (不分顺序)">
        </div>

        <div class="form-group">
            <label for="mustExclude">一定不存在的字母</label>
            <input type="text" id="mustExclude" placeholder="例如: z">
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="enableStemming" checked>
        <label for="enableStemming" style="margin-bottom: 0; cursor: pointer;">启用变形匹配 (同时检查原形、复数、过去式等)</label>
    </div>

    <button onclick="processText()">开始筛选</button>

    <!-- 结果区域 -->
    <div class="result-section">
        <div class="result-header">
            <span>筛选结果： <span id="countBadge" class="badge">0 个</span></span>
        </div>
        <div id="resultContainer" class="word-list">
            <div class="empty-state">请输入文本和条件后点击按钮</div>
        </div>
    </div>
</div>

<script>
    // 简单的词形还原逻辑（规则库）
    function getWordVariations(word) {
        const variations = new Set();
        variations.add(word); // 添加原始单词

        // 规则1：以 s 结尾 (cats -> cat)
        if (word.endsWith('s') && word.length > 3) {
            variations.add(word.slice(0, -1));
        }
        
        // 规则2：以 es 结尾 (boxes -> box)
        if (word.endsWith('es') && word.length > 4) {
            variations.add(word.slice(0, -2));
        }

        // 规则3：以 ies 结尾 (parties -> party)
        if (word.endsWith('ies') && word.length > 4) {
            variations.add(word.slice(0, -3) + 'y');
        }

        // 规则4：以 ed 结尾 (played -> play)
        if (word.endsWith('ed') && word.length > 4) {
            const base = word.slice(0, -2);
            variations.add(base);
            
            // 处理双写辅音的情况 (stopped -> stop)
            // 简单 heuristic: 如果去掉ed后最后两个字母相同 (stopp)，再去掉一个 (stop)
            if (base.length > 2 && base[base.length -1] === base[base.length -2]) {
                variations.add(base.slice(0, -1));
            }
        }
        
        // 规则5：以 ied 结尾 (studied -> study)
        if (word.endsWith('ied') && word.length > 4) {
            variations.add(word.slice(0, -3) + 'y');
        }

        return Array.from(variations);
    }

    function checkCriteria(word, length, mustInclude, mustExclude) {
        if (word.length !== length) return false;

        for (let char of mustInclude) {
            if (!word.includes(char)) return false;
        }

        for (let char of mustExclude) {
            if (word.includes(char)) return false;
        }

        return true;
    }

    function processText() {
        // 1. 获取输入
        const rawText = document.getElementById('sourceText').value;
        const lengthInput = document.getElementById('wordLength').value;
        const mustIncludeRaw = document.getElementById('mustInclude').value;
        const mustExcludeRaw = document.getElementById('mustExclude').value;
        const enableStemming = document.getElementById('enableStemming').checked;

        // 2. 验证
        if (!rawText.trim()) {
            alert('请输入源文本！');
            return;
        }
        if (!lengthInput) {
            alert('请输入单词长度！');
            return;
        }

        const targetLength = parseInt(lengthInput);
        const mustInclude = mustIncludeRaw.toLowerCase().split('').filter(c => c.trim() !== '');
        const mustExclude = mustExcludeRaw.toLowerCase().split('').filter(c => c.trim() !== '');

        // 3. 提取单词
        let words = rawText.match(/[a-zA-Z]+/g);
        if (!words) {
            renderResults([]);
            return;
        }

        // 转换为小写并去重
        let uniqueSourceWords = [...new Set(words.map(w => w.toLowerCase()))];
        let finalResults = [];

        // 4. 遍历筛选
        uniqueSourceWords.forEach(originalWord => {
            let variations = [originalWord];
            
            // 如果启用了词形还原，计算潜在的词根
            if (enableStemming) {
                variations = getWordVariations(originalWord);
            }

            let matchFound = false;
            let matchedForm = "";

            // 检查该单词的所有变形
            for (let form of variations) {
                if (checkCriteria(form, targetLength, mustInclude, mustExclude)) {
                    matchFound = true;
                    matchedForm = form;
                    break; // 只要有一个形式符合，就判定该词符合
                }
            }

            if (matchFound) {
                finalResults.push({
                    original: originalWord,
                    matched: matchedForm,
                    isVariation: originalWord !== matchedForm
                });
            }
        });

        renderResults(finalResults);
    }

    function renderResults(results) {
        const container = document.getElementById('resultContainer');
        const countBadge = document.getElementById('countBadge');
        
        container.innerHTML = '';
        countBadge.textContent = `${results.length} 个`;

        if (results.length === 0) {
            container.innerHTML = '<div class="empty-state">没有找到符合条件的单词</div>';
            return;
        }

        // 排序：先按长度，再按字母顺序
        results.sort((a, b) => a.original.localeCompare(b.original));

        results.forEach(item => {
            const tag = document.createElement('div');
            tag.className = 'word-tag';
            
            // 主文本：源单词
            const mainText = document.createElement('span');
            mainText.textContent = item.original;
            tag.appendChild(mainText);

            // 副文本：如果是因为变形匹配的，显示匹配的词根
            if (item.isVariation) {
                const subText = document.createElement('span');
                subText.className = 'sub-info';
                subText.textContent = `(匹配: ${item.matched})`;
                tag.appendChild(subText);
            }

            container.appendChild(tag);
        });
    }
</script>

</body>
</html>
